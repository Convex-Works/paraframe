# Static files only: no state, no secrets of its own, no outbound traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paraframe-showcase
  labels:
    app.kubernetes.io/name: paraframe-showcase
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paraframe-showcase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paraframe-showcase
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: registry.example.com/paraframe-showcase:latest # OVERLAY: Use the image built from deploy/Dockerfile, by commit.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paraframe-showcase
  labels:
    app.kubernetes.io/name: paraframe-showcase
spec:
  selector:
    app.kubernetes.io/name: paraframe-showcase
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Cloudflare proxies paraframe.convex.works (the *.convex.works record) to the
# cluster's ingress and checks the origin certificate, so the ingress must
# present the *.convex.works Cloudflare origin certificate for this host;
# without a TLS entry it serves its fake default certificate and Cloudflare
# answers 526.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paraframe-showcase
  labels:
    app.kubernetes.io/name: paraframe-showcase
spec:
  ingressClassName: nginx # OVERLAY: Use the ingress class that serves tide.convex.works.
  tls:
    - hosts:
        - paraframe.convex.works
      secretName: convex-works-origin # OVERLAY: The TLS secret holding the *.convex.works origin certificate, in this namespace.
  rules:
    - host: paraframe.convex.works
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paraframe-showcase
                port:
                  name: http
