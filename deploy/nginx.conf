# The prerendered showcase (build/), as served at paraframe.convex.works. Every
# frame is prerendered as /play/<frame>.html and /frame/<frame>.html.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    access_log off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Redirects say only the path: behind the ingress, port 8080 is not public.
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Content-hashed assets never change.
        location /_app/immutable/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        # Pages use relative asset paths, so /play/inbox/ must become /play/inbox.
        location ~ ^(.+)/$ {
            return 301 $1;
        }

        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
